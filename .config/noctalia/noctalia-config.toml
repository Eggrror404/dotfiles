[include]
files = ["templates/fcitx5/", "templates/vicinae/template.toml"]

[accessibility]
ui_scale = 1.1500000096857548

[bar.default]
background_opacity = 0.89999997988343239
concave_edge_corners = true
end = [ "media", "tray", "bar", "privacy", "notifications", "brightness", "volume", "sysmon", "battery", "session" ]
margin_edge = 0
margin_ends = 0
padding = 8
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.1500000096857548
start = [ "group:g1", "workspaces", "active_window" ]
thickness = 28
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "control-center", "btw" ]
    opacity = 0.0
    padding = 0.0
    widget_spacing = 4

[brightness]
enable_ddcutil = true
minimum_brightness = 0.04999999888241291

[config]

[lockscreen]
blur_intensity = 0.29999999329447746
transition = [ "fade" ]
transition_duration = 300

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@HDMI-A-1",
