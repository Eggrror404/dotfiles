[accessibility]
ui_scale = 1.2000000104308128

[bar.default]
background_opacity = 0.89999997988343239
concave_edge_corners = true
end = [ "media", "tray", "notifications", "brightness", "volume", "sysmon", "battery", "session" ]
margin_edge = 0
margin_ends = 0
padding = 8
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.1500000096857548
start = [ "group:g1", "workspaces" ]
thickness = 28
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "control-center", "btw" ]
    opacity = 1.0
    padding = 0.0
    widget_spacing = 4

[brightness]
enable_ddcutil = true
minimum_brightness = 0.099999997764825821

[config]

[lockscreen]
blur_intensity = 0.29999999329447746

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 464.0
    cx = 960.0
    cy = 575.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = true
        input_opacity = 0.0
        input_radius = 8.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 96.0
    box_width = 496.0
    cx = 960.0
    cy = 460.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "label"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        shadow = false
        title = "PC is locked, btw"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 48.0
    box_width = 400.0
    cx = 960.0
    cy = 1060.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        color = "on_surface"
        format = "hi it is {:%H:%M} what are you doing with you life"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 192.0
    cy = 1004.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        hide_when_no_media = true
        layout = "horizontal"
        shadow = false

[plugins]
auto_update = "none"
enabled = []

[shell]
font_family = "Quicksand"
password_style = "random"
polkit_agent = true
settings_show_advanced = true
ui_scale = 1.1500000096857548

    [shell.panel]
    open_near_click_session = true

    [shell.session]
    show_shortcuts = false

[templates]

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "qt" ]

[weather]
enabled = false

[widget.brightness]
show_label = false

[widget.btw]
color = "primary"
text = "btw"
type = "text"

    [widget.btw.actions]
    left = "panel-open control-center home"

[widget.clock]
font_weight = 600
format = "{:%H:%M %a, %b %d}"

    [widget.clock.actions]
    right = "panel-open control-center home"

[widget.control-center]
custom_image = "/usr/share/pixmaps/archlinux-logo.svg"
custom_image_colorize = true
icon_color = "primary"

[widget.media]
hide_album_art = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.session]
color = "error"

[widget.sysmon]
show_value = false

[widget.workspaces]
pill_scale = 0.70000000000000007
show_labels = false
