[plugins]
auto_update = "none"
enabled = [ "rylos/tailnet", "conqazht/share-wifi" ]

[shell]
font_family = "Quicksand"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true

    [shell.panel]
    open_near_click_session = true

    [shell.screen_corners]
    enabled = true
    size = 16

    [shell.session]
    show_shortcuts = false

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "hyprland", "qt" ]
    enable_community_templates = false

[weather]
enabled = false

[widget.bar]
show_count = false
type = "rylos/tailnet:bar"

[widget.brightness]
show_label = false

[widget.btw]
color = "primary"
text = "btw"
type = "text"

    [widget.btw.actions]
    left = "panel-open control-center home"

[widget.clock]
font_weight = 600
format = "{:%H:%M %a, %b %d}"

    [widget.clock.actions]
    right = "panel-open control-center home"

[widget.control-center]
custom_image = "/usr/share/pixmaps/archlinux-logo.svg"
custom_image_colorize = true
icon_color = "primary"

[widget.media]
hide_album_art = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.privacy]
hide_inactive = true

[widget.session]
color = "error"

[widget.sysmon]
show_value = false

[widget.volume]
show_label = false

[widget.workspaces]
pill_scale = 0.70000000000000007
show_labels = false
